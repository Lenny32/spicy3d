# The web app as static files. Account email links (SpicySrv `AccountLinks`) point at app routes
# (`/verify-email?…`, `/reset-password?…`, `/confirm-email-change?…`): they serve the app, which
# opens the matching dialog and puts its own path back in the address bar.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(verify-email|reset-password|confirm-email-change)/?$ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
