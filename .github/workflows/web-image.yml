name: Web image

# spicy3d-web:<version>, the image SpicySrv's compose runs as its `web` service (SpicySrv deploy/):
# the static app on port 8080, non-root, read-only root file system. One image for every
# deployment, LAN or public: nothing server-specific is baked in (docs/deployment.md).
#
# Manual run (Actions > Web image > Run workflow) with the version to tag (SPICY_VERSION on the
# server). The image is smoke-tested running as the server runs it, then kept as run artifacts —
# `spicy3d-web-<version>.tar.gz` for `docker load` on an air-gapped server, and the plain dist/
# tarball. With publish = ghcr, a separate job (the only one allowed to write packages, and only
# from main or a tag) pushes that very image to ghcr.io/<owner>/spicy3d-web:<version>.

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Image tag, e.g. 0.0.1 (the server's SPICY_VERSION)"
                required: true
            publish:
                description: "What to do with the image (ghcr: from main or a tag only)"
                type: choice
                default: artifact-only
                options:
                    - artifact-only
                    - ghcr

permissions:
    contents: read

env:
    VERSION: ${{ inputs.version }}

jobs:
    image:
        name: Build spicy3d-web
        runs-on: ubuntu-latest
        steps:
            - name: Check version
              run: |
                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo "::error::version must look like 1.2.3 or 1.2.3-rc.1, got '$VERSION'"
                      exit 1
                  fi

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: Build image
              run: docker build -t "spicy3d-web:$VERSION" .

            # Like SpicySrv's compose: read-only, only /tmp writable, no capabilities.
            - name: Run it as the server does
              run: |
                  docker run -d --name web --read-only --tmpfs /tmp --cap-drop ALL \
                      --security-opt no-new-privileges:true -p 127.0.0.1:8080:8080 "spicy3d-web:$VERSION"
                  for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
                  test "$(docker exec web id -u)" != 0
                  curl -fsS -o /dev/null "http://127.0.0.1:8080/verify-email?userId=x&token=y"

            - run: npm ci

            - name: Smoke test the running image
              run: |
                  npx playwright install --with-deps --only-shell chromium
                  npm run smoke -- --url http://localhost:8080/

            - name: Export
              run: |
                  mkdir out
                  docker save "spicy3d-web:$VERSION" | gzip > "out/spicy3d-web-$VERSION.tar.gz"
                  docker cp web:/usr/share/nginx/html dist
                  tar -czf "out/spicy3d-web-dist-$VERSION.tar.gz" -C dist .
                  (cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS)

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: spicy3d-web-${{ inputs.version }}
                  path: out/
                  if-no-files-found: error

    push:
        name: Push to GitHub Container Registry
        needs: image
        if: inputs.publish == 'ghcr' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: spicy3d-web-${{ inputs.version }}
                  path: out

            # The tested image itself, not a rebuild.
            - name: Push
              env:
                  GH_TOKEN: ${{ github.token }}
                  OWNER: ${{ github.repository_owner }}
              run: |
                  (cd out && sha256sum -c SHA256SUMS)
                  gunzip -c "out/spicy3d-web-$VERSION.tar.gz" | docker load
                  image="ghcr.io/${OWNER,,}/spicy3d-web:$VERSION"
                  echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
                  docker tag "spicy3d-web:$VERSION" "$image"
                  docker push "$image"
                  echo "Pushed $image" >> "$GITHUB_STEP_SUMMARY"
