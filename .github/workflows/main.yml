name: Test

# Only when code the tests run or read changed: docs-only pushes (except the docs tests read) and empty
# commits trigger nothing.
on:
    push:
        branches: ["main"]
        paths: &test-paths
            - "packages/**"
            - "plugins/**"
            - "public/**"
            - "package.json"
            - "package-lock.json"
            - "tsconfig.json"
            - "rstest.config.ts"
            - ".github/workflows/main.yml"
            # Read by tests (CSP, origin validation, dependency pins, generator freshness).
            - "rspack.config.ts"
            - "docker/**"
            - "scripts/generate-cloud-api.mjs"
            - "scripts/generate-shape-capabilities.mjs"
            - "scripts/rewrite-history.sh"
            - ".github/dependabot.yml"
            - "!**.md"
            # Read by packages/builder/test/mergeRules.test.ts.
            - "docs/merge.md"
    pull_request:
        branches: ["main"]
        paths: *test-paths

jobs:
    test-and-deploy:
        runs-on: ubuntu-26.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            # packages/builder/test/rewriteHistory.test.ts runs scripts/rewrite-history.sh, which needs it
            # (skipped without).
            - name: Install git-filter-repo
              run: pipx install git-filter-repo==2.47.0

            - name: Run unit tests
              run: npm run test
