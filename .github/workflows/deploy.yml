name: Deploy

# Continuous delivery: builds the web application, deploys it to GitHub Pages, publishes it as a
# Docker image and builds the MCP bridge that matches it (package-mcp-bridge.yml).
#
# - Push to main or manual run (Actions > Deploy > Run workflow): tests, builds and deploys the
#   site; the bridge executables are built and verified (run artifact) but not published.
# - Docker image: the same dist/ served by nginx (Dockerfile, target `prebuilt`), pushed to
#   ghcr.io/<owner>/<repo> as `latest` and `<app version>` (package.json), for linux/amd64 and
#   linux/arm64. `docker pull ghcr.io/lenny32/spicy3d` needs the package to be public (Packages >
#   spicy3d > Package settings) or a `docker login ghcr.io`.
# - Bridge releases are published by hand: Actions > Package MCP bridge > Run workflow, with
#   publish = release. The site links the release of package.json's version.
#
# One-time setup: Settings > Pages > Source = "GitHub Actions".

on:
    push:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read

# Never cancel a deployment halfway; a newer push waits for the running one.
concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

jobs:
    prepare:
        name: Resolve version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            app-version: ${{ steps.version.outputs.app-version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # A build-only bridge version: this workflow never publishes the executables.
            - id: version
              run: |
                  pkg=$(node -p "require('./package.json').version")
                  echo "version=$pkg-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
                  echo "app-version=$pkg" >> "$GITHUB_OUTPUT"
                  echo "Deploying ${GITHUB_SHA::7} ($GITHUB_REF_NAME), app version $pkg" >> "$GITHUB_STEP_SUMMARY"

    web:
        name: Build web application
        needs: prepare
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # No npm cache: a cache written by a branch build would be restored by default-branch runs.
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - run: npm ci

            - run: npm run test

            # Packs the npx bridge tarball into public/mcp/, bundles the app, builds the plugins.
            - name: Build
              run: npm run build
              env:
                  NODE_ENV: production

            - name: Check output
              run: |
                  test -f dist/index.html
                  ls dist/mcp/spicy3d-mcp-bridge-*.tgz
                  ls dist/*.wasm

            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: dist

            # The same files for the Docker image.
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: web-dist
                  path: dist
                  if-no-files-found: error
                  retention-days: 1

    docker:
        name: Publish Docker image
        needs: [prepare, web]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: web-dist
                  path: dist

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Image names are lowercased by the action (ghcr.io/lenny32/spicy3d).
            - id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest
                      type=raw,value=${{ needs.prepare.outputs.app-version }}

            # The prebuilt target only copies files (no RUN), so arm64 needs no QEMU.
            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  target: prebuilt
                  build-contexts: dist=./dist
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

    mcp-bridge:
        name: MCP bridge
        needs: prepare
        uses: ./.github/workflows/package-mcp-bridge.yml
        with:
            version: ${{ needs.prepare.outputs.version }}
            publish: artifact-only

    deploy:
        name: Deploy to GitHub Pages
        needs: [web, mcp-bridge]
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
