name: Package MCP bridge

# Standalone spicy3d-mcp-bridge executables: users download one file and point their MCP client at
# it, with no Node.js and no checkout.
#
# - Called by deploy.yml (the CD) on every deploy: builds and verifies them only (run artifact).
# - Manual run (Actions > Package MCP bridge > Run workflow): builds the branch or tag picked in
#   "Use workflow from" with a version you type, and either only keeps the files as a downloadable run artifact or also
#   publishes them as a (pre)release. The Run workflow button only exists for workflows on the
#   default branch, and GitHub registers a new workflow from a push that changes its file.

on:
    workflow_call:
        inputs:
            version:
                description: "Version to stamp into the executables, e.g. 0.7.2 or 0.7.2-rc.1"
                type: string
                required: true
            publish:
                description: "artifact-only, prerelease or release"
                type: string
                default: artifact-only
    workflow_dispatch:
        inputs:
            version:
                description: "Version to stamp into the executables, e.g. 0.7.2 or 0.7.2-rc.1"
                required: true
            publish:
                description: "What to do with the files"
                type: choice
                default: artifact-only
                options:
                    - artifact-only
                    - prerelease
                    - release

permissions:
    contents: read

concurrency:
    group: package-mcp-bridge-${{ inputs.version }}

env:
    VERSION: ${{ inputs.version }}

jobs:
    prepare:
        name: Check version
        runs-on: ubuntu-latest
        steps:
            - name: Check version
              run: |
                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo "::error::version must look like 1.2.3 or 1.2.3-rc.1, got '$VERSION'"
                      exit 1
                  fi
                  echo "Building ${GITHUB_SHA::7} as $VERSION" >> "$GITHUB_STEP_SUMMARY"

    build:
        # Node.js single executable applications: the bundled bridge is injected into each
        # platform's official Node binary. macOS targets are built on macOS, where the script can
        # strip Node's signature before the injection and ad-hoc sign the result.
        name: Build ${{ matrix.name }}
        needs: prepare
        strategy:
            matrix:
                include:
                    - { name: windows-linux, os: ubuntu-latest, targets: windows-x64 linux-x64 linux-arm64 }
                    - { name: macos, os: macos-latest, targets: macos-x64 macos-arm64 }
        runs-on: ${{ matrix.os }}
        steps:
            # The run's own commit (github.sha, not the moving branch), so every job builds the same one.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # No npm cache: a cache written by a tag or branch build would be restored by
            # default-branch runs.
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - run: npm ci

            # The executables report this through --version; the npm tarball is named after it.
            - name: Stamp version
              run: |
                  npm pkg set version="$VERSION"
                  npm pkg set version="$VERSION" --prefix packages/mcp-bridge

            - run: node scripts/build-mcp-bridge-binaries.mjs ${{ matrix.targets }}

            - name: npm package (for npx users)
              if: matrix.name == 'windows-linux'
              run: npm pack --pack-destination ../../dist-bridge
              working-directory: packages/mcp-bridge

            - uses: actions/upload-artifact@v4
              with:
                  name: build-${{ matrix.name }}
                  path: dist-bridge/spicy3d-mcp-bridge-*
                  if-no-files-found: error

    verify:
        name: Verify on ${{ matrix.target }}
        needs: build
        strategy:
            fail-fast: true
            matrix:
                include:
                    - { target: windows-x64, os: windows-latest, file: spicy3d-mcp-bridge-windows-x64.exe }
                    - { target: linux-x64, os: ubuntu-latest, file: spicy3d-mcp-bridge-linux-x64 }
                    - { target: linux-arm64, os: ubuntu-24.04-arm, file: spicy3d-mcp-bridge-linux-arm64 }
                    - { target: macos-x64, os: macos-15-intel, file: spicy3d-mcp-bridge-macos-x64 }
                    - { target: macos-arm64, os: macos-latest, file: spicy3d-mcp-bridge-macos-arm64 }
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: build-*
                  merge-multiple: true
                  path: bin

            # Ad-hoc signed by the build (enough to run; Gatekeeper still flags a download without
            # a paid Developer ID, which the MCP panel explains). Fail here if it is not.
            - name: Check signature (macOS)
              if: startsWith(matrix.target, 'macos')
              run: codesign --verify --verbose "bin/${{ matrix.file }}"

            - name: Smoke test (version + MCP handshake)
              run: |
                  chmod +x "bin/${{ matrix.file }}"
                  reported=$("bin/${{ matrix.file }}" --version 2>&1)
                  echo "reports $reported"
                  test "$reported" = "$VERSION"
                  init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
                  reply=$( (echo "$init"; sleep 3) | "bin/${{ matrix.file }}" --app-url https://ci.example/ --port 7777 --token ci | head -n 1)
                  echo "$reply"
                  echo "$reply" | grep -q '"serverInfo":{"name":"spicy3d"'

    package:
        name: Package ${{ inputs.version }}
        needs: verify
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: build-*
                  merge-multiple: true
                  path: release

            - name: Checksums
              run: |
                  count=0
                  for f in release/spicy3d-mcp-bridge-*; do [[ "$f" == *.tgz ]] || count=$((count + 1)); done
                  test "$count" -eq 5
                  cd release && sha256sum spicy3d-mcp-bridge-* > SHA256SUMS && cat SHA256SUMS

            # Always available from the run's summary page, whatever "publish" says.
            - uses: actions/upload-artifact@v4
              with:
                  name: spicy3d-mcp-bridge-${{ env.VERSION }}
                  path: release/
                  if-no-files-found: error

            - name: Publish to GitHub release
              if: inputs.publish == 'prerelease' || inputs.publish == 'release'
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  PRERELEASE: ${{ inputs.publish == 'prerelease' }}
              run: |
                  # Reuses the tag if it already exists; otherwise creates "$VERSION" at the built commit.
                  flags=(--target "$GITHUB_SHA" --title "$VERSION" --generate-notes)
                  [ "$PRERELEASE" = true ] && flags+=(--prerelease)
                  if ! gh release view "$VERSION" >/dev/null 2>&1; then
                      gh release create "$VERSION" "${flags[@]}"
                  fi
                  gh release upload "$VERSION" release/* --clobber
                  echo "Published to $(gh release view "$VERSION" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
