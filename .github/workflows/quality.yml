name: Code Quality

# Runs only what the change can affect. Documentation-only pushes and empty commits trigger nothing
# (the `paths` filter: no changed file left once the docs are excluded = no run); otherwise job
# `changes` sorts the changed files into areas and each job runs only for its area. The weekly
# schedule and manual runs check everything.
on:
    push:
        branches: ["main", "develop"]
        paths: &code-paths
            - "**"
            - "!**.md"
            - "!docs/**"
            - "!tickets/**"
            - "!screenshots/**"
            - "!LICENSE"
            - "!NOTICE"
            - "!.vscode/**"
    pull_request:
        branches: ["main", "develop"]
        paths: *code-paths
    schedule:
        # Weekly scan so new advisories / rules surface even without commits.
        - cron: "0 4 * * 1"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Which areas the push or pull request touches. Keep the doc patterns in step with `paths` above.
    # Everything is checked when the diff cannot be computed (new branch, force push to an unknown
    # commit), when this workflow itself changes, and on schedule / manual runs.
    changes:
        name: Detect changed areas
        runs-on: ubuntu-26.04
        outputs:
            ts: ${{ steps.areas.outputs.ts }}
            cpp: ${{ steps.areas.outputs.cpp }}
            deps: ${{ steps.areas.outputs.deps }}
            code: ${{ steps.areas.outputs.code }}
            codeql: ${{ steps.areas.outputs.codeql }}
        steps:
            # Full history without file contents: enough for `git diff --name-only`.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  filter: blob:none

            - id: areas
              env:
                  EVENT: ${{ github.event_name }}
                  BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
              run: |
                  ts=false cpp=false deps=false actions=false code=false everything=false
                  if [[ "$EVENT" != push && "$EVENT" != pull_request ]]; then
                      everything=true
                  elif [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2> /dev/null; then
                      everything=true
                  else
                      # Pull request: HEAD is the merge commit, so this is the pull request's diff.
                      while IFS= read -r file; do
                          case "$file" in
                              "" | *.md | docs/* | tickets/* | screenshots/* | LICENSE | NOTICE | .vscode/*) continue ;;
                          esac
                          code=true
                          case "$file" in
                              .github/workflows/quality.yml) everything=true ;;
                              .github/*) actions=true ;;
                              cpp/*) cpp=true ;;
                              packages/* | plugins/* | scripts/* | public/* | *.ts | *.js | *.mjs | *.cjs | *.css | *.json) ts=true ;;
                          esac
                          case "$file" in
                              package.json | package-lock.json | */package.json) deps=true ;;
                          esac
                      done <<< "$(git diff --name-only "$BASE...HEAD")"
                  fi
                  if [[ "$everything" == true ]]; then
                      ts=true cpp=true deps=true actions=true code=true
                  fi
                  languages=()
                  [[ "$ts" == true ]] && languages+=(javascript-typescript)
                  [[ "$cpp" == true ]] && languages+=(c-cpp)
                  [[ "$actions" == true ]] && languages+=(actions)
                  codeql=$(jq -cn '$ARGS.positional' --args "${languages[@]}")
                  {
                      echo "ts=$ts"
                      echo "cpp=$cpp"
                      echo "deps=$deps"
                      echo "code=$code"
                      echo "codeql=$codeql"
                  } >> "$GITHUB_OUTPUT"
                  {
                      echo "| Area | Checked |"
                      echo "| --- | --- |"
                      echo "| TypeScript / JS | $ts |"
                      echo "| C++ | $cpp |"
                      echo "| Dependencies | $deps |"
                      echo "| Workflows | $actions |"
                      echo "| Any code (Semgrep) | $code |"
                  } >> "$GITHUB_STEP_SUMMARY"

    lint:
        name: Lint & format (Biome, clang-format)
        needs: changes
        if: needs.changes.outputs.ts == 'true' || needs.changes.outputs.cpp == 'true'
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - name: Biome
              if: needs.changes.outputs.ts == 'true'
              run: npx biome ci --reporter=github .

            - name: clang-format (cpp/src)
              if: needs.changes.outputs.cpp == 'true'
              run: npx clang-format --style=Webkit --sort-includes --dry-run -Werror cpp/src/*

    typecheck:
        name: Typecheck (tsc)
        needs: changes
        if: needs.changes.outputs.ts == 'true'
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npx tsc --noEmit -p tsconfig.json

            # The typed API client must match the committed server spec (packages/cloud/openapi.json).
            - run: npm run cloud:api:check

    semgrep:
        name: Semgrep (SAST)
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install Semgrep
              run: |
                  pipx install semgrep
                  # OpenTelemetry still imports pkg_resources, removed in setuptools 82.
                  pipx inject semgrep 'setuptools<82'
                  semgrep --version

            - name: Scan
              run: >
                  semgrep scan
                  --config p/default
                  --config p/typescript
                  --config p/secrets
                  --metrics=off
                  --sarif-output=semgrep.sarif
                  --text

            - name: Upload SARIF to code scanning
              if: always() && hashFiles('semgrep.sarif') != '' && github.event.pull_request.head.repo.fork != true
              uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with:
                  sarif_file: semgrep.sarif
                  category: semgrep

            # WARNING/INFO findings are reported in code scanning only; ERROR-level ones fail the job.
            - name: Fail on ERROR-level findings
              run: |
                  count=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
                  echo "Semgrep ERROR findings: $count"
                  test "$count" -eq 0

    codeql:
        name: CodeQL (${{ matrix.language }})
        needs: changes
        if: needs.changes.outputs.codeql != '[]'
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                # javascript-typescript, c-cpp and actions, each only when its sources changed.
                language: ${{ fromJSON(needs.changes.outputs.codeql) }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with:
                  languages: ${{ matrix.language }}
                  # No build: the C++ sources need Emscripten + OCCT, so extract them without compiling.
                  build-mode: none
                  queries: security-and-quality
                  config: |
                      paths-ignore:
                          - packages/wasm/lib
                          - public
                          - dist

            - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with:
                  category: codeql-${{ matrix.language }}

    dependencies:
        name: Dependency audit
        # New advisories without a dependency change surface in the weekly scheduled run.
        needs: changes
        if: needs.changes.outputs.deps == 'true'
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: npm audit (runtime deps, high+)
              run: npm audit --omit=dev --audit-level=high

            # The build tools too: they run in CI and on developers' machines with access to the source
            # and, in the release workflows, to publishing credentials. A finding with no fix yet is
            # documented in docs/security.md rather than silenced here.
            - name: npm audit (all deps, high+)
              run: npm audit --audit-level=high

            - name: Dependency review
              if: github.event_name == 'pull_request'
              uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  fail-on-severity: high
                  comment-summary-in-pr: on-failure
