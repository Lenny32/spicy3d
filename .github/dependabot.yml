version: 2
updates:
    # Keeps the SHA-pinned actions in .github/workflows up to date.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release, so compromised or broken versions get caught first.
      cooldown:
          default-days: 7
      groups:
          actions:
              patterns: ["*"]

    # The Dockerfile's digest-pinned base images (node, nginx-unprivileged).
    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          docker:
              patterns: ["*"]

    # npm (every workspace through the root lockfile). The clients that handle credentials or run agent
    # traffic — the MCP SDK, the generated API client's runtime and generator — are pinned to exact
    # versions and get a pull request of their own, reviewed with their changelog
    # (docs/security.md); everything else comes grouped.
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      open-pull-requests-limit: 10
      groups:
          npm:
              patterns: ["*"]
              exclude-patterns: ["@modelcontextprotocol/sdk", "openapi-fetch", "openapi-typescript"]
