version: 2
updates:
    # Keeps the SHA-pinned actions in .github/workflows up to date.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release, so compromised or broken versions get caught first.
      cooldown:
          default-days: 7
      groups:
          actions:
              patterns: ["*"]

    # The Dockerfile's digest-pinned base images (node, nginx-unprivileged).
    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          docker:
              patterns: ["*"]
