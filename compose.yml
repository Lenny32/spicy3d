# The web app alone (no server: local documents only), run like SpicySrv's compose runs the image.
# With a server, use SpicySrv's deploy/ compose instead (docs/deployment.md).
services:
    spicy3d:
        # `docker compose pull` takes the image the deploy workflow published;
        # `docker compose build` builds it from this checkout instead.
        image: ghcr.io/lenny32/spicy3d:latest
        build:
            dockerfile: Dockerfile
        restart: unless-stopped
        read_only: true
        tmpfs: [/tmp]
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        ports:
            - "8080:8080"
